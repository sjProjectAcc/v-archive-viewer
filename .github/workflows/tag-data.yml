name: Deploy tag data

on:
  workflow_dispatch:

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download current desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloads
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern v-archive-viewer-windows-x64.zip --dir downloads
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "DESKTOP_DOWNLOAD_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/v-archive-viewer-windows-x64.zip" >> "$GITHUB_ENV"

      - name: Validate tag snapshots
        run: |
          node --check web/app.js
          node --check scripts/update-tag-data.mjs
          npm run tags:validate
          npm audit --audit-level=high

      - name: Build GitHub Pages site
        env:
          PUBLIC_BASE_PATH: /v-archive-viewer/
          COPY_DESKTOP_DOWNLOAD: "false"
        run: npm run build

      - name: Upload site build
        uses: actions/upload-artifact@v4
        with:
          name: pages-site
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site build
        uses: actions/download-artifact@v4
        with:
          name: pages-site
          path: dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
